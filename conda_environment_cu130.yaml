name: equidiff
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch ecosystem — CUDA 13.0 builds from conda-forge
  - pytorch=2.10.0
  - torchaudio=2.10.0
  - torchvision=0.25.0
  - pytorch3d=0.7.9
  # Core numerics
  - numpy=1.23.3
  - numba=0.56.4
  - scipy=1.9.1
  # Vision / IO
  - py-opencv=4.6.0
  - cffi=1.15.1
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - scikit-video=1.1.11
  - scikit-image=0.19.3
  - av=10.0.0
  # Jupyter / plotting
  - ipykernel=6.16
  - matplotlib=3.6.1
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  # Data / ML utilities
  - zarr=2.12.0
  - numcodecs=0.10.2
  - h5py=3.7.0
  - hydra-core=1.2.0
  - einops=0.4.1
  - tqdm=4.64.1
  - dill=0.3.5.1
  - accelerate=0.13.2
  - datasets=2.6.1
  - diffusers=0.11.1
  # Simulation / gym deps
  - gym=0.21.0
  - pymunk=6.2.1
  - shapely=1.8.4
  # Misc
  - threadpoolctl=3.1.0
  - cython=0.29.32
  - imagecodecs=2022.8.8
  - termcolor=2.0.1
  - psutil=5.9.2
  - click=8.0.4
  - boto3=1.24.96
  - cmake=3.24.3
  - gfortran_linux-64
  # Avoid CPU-affinity issue: https://github.com/pytorch/pytorch/issues/99625
  - llvm-openmp=14
  - pip:
    - open3d
    - wandb==0.17.0
    - pygame
    - imagecodecs==2022.9.26
    - escnn @ https://github.com/pointW/escnn/archive/fc4714cb6dc0d2a32f9fcea35771968b89911109.tar.gz
    - robosuite @ https://github.com/ARISE-Initiative/robosuite/archive/b9d8d3de5e3dfd1724f4a0e6555246c460407daa.tar.gz
    - robomimic @ https://github.com/pointW/robomimic/archive/8aad5b3caaaac9289b1504438a7f5d3a76d06c07.tar.gz
    - robosuite-task-zoo @ https://github.com/pointW/robosuite-task-zoo/archive/0f8a7b2fa5d192e4e8800bebfe8090b28926f3ed.tar.gz
